name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # AppImage needs FUSE and downloads tooling at build time; deb + rpm are enough to prove the bundle.
            bundle-args: --bundles deb,rpm
          - os: windows-latest
            bundle-args: ""
          # app + dmg, unsigned: the config names no signing identity, so none is needed.
          - os: macos-latest
            bundle-args: ""
    steps:
      # Prettier checks line endings, so the Windows checkout must not rewrite them.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # No `version`: it comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:rust
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rust

      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - run: pnpm tauri build ${{ matrix.bundle-args }}

      # The binary just built, in a throw-away X session: window, SQLite, close,
      # restart, single instance, and one set logged through WebDriver.
      - name: Smoke-test the app (Linux)
        if: runner.os == 'Linux'
        env:
          NABD_SMOKE_BINARY: src-tauri/target/release/nabd
          NABD_SMOKE_REQUIRE_WEBDRIVER: 1
        run: |
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus openbox xdotool sqlite3 curl webkit2gtk-driver
          cargo install tauri-driver --locked
          scripts/smoke/linux-smoke.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
