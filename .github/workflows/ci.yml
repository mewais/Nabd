name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # What each platform bundles is in .github/actions/bundle.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # Prettier checks line endings, so the Windows checkout must not rewrite them.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - run: pnpm lint
      # The smoke kit's shell scripts run on Linux only, where the setup action installs shellcheck.
      - run: pnpm lint:sh
        if: runner.os == 'Linux'
      - run: pnpm lint:rust
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rust

      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - id: bundle
        uses: ./.github/actions/bundle

      # The binary just built, in a throw-away X session (and a headless sway, for
      # Wayland) with a fake tray host and notification service; docs/smoke-test.md
      # says what it checks. The WebDriver for WebKitGTK is `webkit2gtk-driver` up
      # to Ubuntu 24.04 and `webkitgtk-webdriver` after; whichever this image has
      # is installed.
      - name: Smoke-test the app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          NABD_SMOKE_BINARY: src-tauri/target/release/nabd
          NABD_SMOKE_REQUIRE_WEBDRIVER: 1
        run: |
          driver=webkit2gtk-driver
          apt-cache policy "$driver" | grep -q 'Candidate: [0-9]' || driver=webkitgtk-webdriver
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus openbox xdotool libfaketime \
            python3-dbus python3-gi gir1.2-gtk-3.0 sway wtype "$driver"
          cargo install tauri-driver --locked
          scripts/smoke/linux-smoke.sh

      # The same shared checks on the runner's desktop, with the account's own
      # %APPDATA% and Run key (the runner is thrown away), then through WebDriver
      # (tauri-driver + an msedgedriver matching the WebView2 runtime, found or
      # downloaded by the script): a set logged, "Open at startup", Settings → Quit
      # and the system's idle time. scripts/smoke/windows-smoke.mjs says more.
      - name: Smoke-test the app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        env:
          NABD_SMOKE_BINARY: src-tauri/target/release/nabd.exe
          NABD_SMOKE_REQUIRE_WEBDRIVER: 1
        run: |
          cargo install tauri-driver --locked
          pnpm smoke:windows

      # The shared checks that need no WebDriver (WKWebView has none) on a copy of
      # the universal .app, with HOME in a temporary folder; closing the window
      # and the menu-bar item's menu through System Events where the runner
      # allows UI scripting. scripts/smoke/macos-smoke.mjs says more.
      - name: Smoke-test the app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          NABD_SMOKE_BINARY: ${{ steps.bundle.outputs.dir }}/macos/Nabd.app
        run: pnpm smoke:macos

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-${{ runner.os }}
          path: ${{ steps.bundle.outputs.files }}
          if-no-files-found: error
