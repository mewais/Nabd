name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            # AppImage needs FUSE and downloads tooling at build time; deb + rpm are enough to prove the bundle.
            bundle-args: --bundles deb,rpm
            bundle-dir: src-tauri/target/release/bundle
          - os: windows-latest
            bundle-args: ""
            bundle-dir: src-tauri/target/release/bundle
          # app + dmg, unsigned: the config names no signing identity, so none is needed. One
          # universal binary (Apple silicon and Intel), built from both Rust targets.
          - os: macos-latest
            bundle-args: --target universal-apple-darwin
            bundle-dir: src-tauri/target/universal-apple-darwin/release/bundle
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
    steps:
      # Prettier checks line endings, so the Windows checkout must not rewrite them.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential curl wget file pkg-config libssl-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev rpm

      # No `version`: it comes from `packageManager` in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm lint:rust
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:rust

      - name: Install the browser for the end-to-end tests
        run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e

      - run: pnpm tauri build ${{ matrix.bundle-args }}

      # The binary just built, in a throw-away X session with a fake tray host and
      # notification service: the checks every platform shares (window, SQLite,
      # restart, single instance, the login entry, a set logged through WebDriver,
      # Settings → Quit), then the tray menu, nudge notifications and idle time
      # (X11, and Wayland under a headless sway). scripts/smoke/linux-smoke.sh says
      # what each part checks. The WebDriver for WebKitGTK is `webkit2gtk-driver`
      # up to Ubuntu 24.04 and `webkitgtk-webdriver` after; whichever this image
      # has is installed.
      - name: Smoke-test the app (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 20
        env:
          NABD_SMOKE_BINARY: src-tauri/target/release/nabd
          NABD_SMOKE_REQUIRE_WEBDRIVER: 1
        run: |
          driver=webkit2gtk-driver
          apt-cache policy "$driver" | grep -q 'Candidate: [0-9]' || driver=webkitgtk-webdriver
          sudo apt-get install -y --no-install-recommends \
            xvfb dbus dbus-x11 openbox xdotool curl libfaketime shellcheck \
            python3-dbus python3-gi gir1.2-gtk-3.0 sway wtype "$driver"
          pnpm lint:sh
          cargo install tauri-driver --locked
          scripts/smoke/linux-smoke.sh

      # The same shared checks on the runner's desktop, with the account's own
      # %APPDATA% and Run key (the runner is thrown away), then through WebDriver
      # (tauri-driver + an msedgedriver matching the WebView2 runtime, found or
      # downloaded by the script): a set logged, "Open at startup", Settings → Quit
      # and the system's idle time. scripts/smoke/windows-smoke.mjs says more.
      - name: Smoke-test the app (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 20
        env:
          NABD_SMOKE_BINARY: src-tauri/target/release/nabd.exe
          NABD_SMOKE_REQUIRE_WEBDRIVER: 1
        run: |
          cargo install tauri-driver --locked
          pnpm smoke:windows

      # The shared checks that need no WebDriver (WKWebView has none) on a copy of
      # the universal .app, with HOME in a temporary folder; closing the window
      # and the menu-bar item's menu through System Events where the runner
      # allows UI scripting. scripts/smoke/macos-smoke.mjs says more.
      - name: Smoke-test the app (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        env:
          NABD_SMOKE_BINARY: ${{ matrix.bundle-dir }}/macos/Nabd.app
        run: pnpm smoke:macos

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-${{ runner.os }}
          path: |
            ${{ matrix.bundle-dir }}/deb/*.deb
            ${{ matrix.bundle-dir }}/rpm/*.rpm
            ${{ matrix.bundle-dir }}/nsis/*.exe
            ${{ matrix.bundle-dir }}/msi/*.msi
            ${{ matrix.bundle-dir }}/dmg/*.dmg
          if-no-files-found: error
