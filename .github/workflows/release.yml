name: Release

# Pushing a tag `v<version>` builds the installers on all three platforms, exactly as
# CI does (.github/actions/setup and bundle), and attaches them to a draft GitHub
# Release for the tag, to be reviewed and published by hand. docs/development.md
# ("Cutting a release") has the steps.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Check the tag against package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # package.json holds the app's version (src-tauri/build.rs keeps Cargo.toml equal to it).
      - run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json's version $version: tag v$version, or bump the version first."
            exit 1
          fi

  bundle:
    name: Bundle (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # The same platforms as CI; what each bundles is in .github/actions/bundle.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      # As in CI: the Windows checkout must not rewrite line endings.
      - name: Keep LF line endings
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup

      - id: bundle
        uses: ./.github/actions/bundle

      - uses: actions/upload-artifact@v4
        with:
          name: nabd-${{ runner.os }}
          path: ${{ steps.bundle.outputs.files }}
          if-no-files-found: error

  release:
    name: Draft the release
    needs: bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      # The gh CLI the runner already has, rather than a third-party action holding a
      # write token: one command creates the draft with every installer attached. A
      # draft for the tag left from an earlier run must be deleted before running again.
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --verify-tag \
            --title "Nabd $GITHUB_REF_NAME" \
            --generate-notes
