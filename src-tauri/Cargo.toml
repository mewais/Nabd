[workspace]
resolver = "2"
members = ["crates/persistence", "crates/native", "crates/ipc"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"

[workspace.dependencies]
nabd-persistence = { path = "crates/persistence" }
nabd-native = { path = "crates/native" }
nabd-ipc = { path = "crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# The Tauri binary.
[package]
name = "nabd"
description = "Nabḍ — desk workout tracker"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
default-run = "nabd"

# Named apart from the binary: on Windows a library and a binary of the same
# name collide.
[lib]
name = "nabd_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = { workspace = true }

[dependencies]
# `macos-private-api` is what a transparent window on macOS needs (and must
# agree with `macOSPrivateApi` in tauri.conf.json); on other platforms it only
# switches on macOS code paths.
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
chrono = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
nabd-native = { workspace = true }
nabd-ipc = { workspace = true }

# Linux idle time and tray-host detection speak D-Bus, X11 and Wayland directly.
# All are pure Rust (zbus, gtk and gdkx11 are already in the tree through Tauri),
# so no extra system library is linked: no libXss, no libwayland.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
gtk = "0.18"
gdkx11 = "0.18"
x11rb = { version = "0.13", features = ["screensaver"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

# The menu-bar icon is a PNG, which Tauri only decodes with `image-png`.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-graphics = "0.3"
tauri = { version = "2", features = ["image-png"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# Tauri's custom protocol, for production builds.
custom-protocol = ["tauri/custom-protocol"]

# Small, self-contained release binary. `panic = "abort"` also means a panic on
# a background thread (the clock) ends the app instead of leaving it running
# without nudges.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
