[workspace]
resolver = "2"
members = [
    "crates/B11-persistence",
    "crates/B12-native",
    "crates/B13-ipc",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

# ── Tauri binary crate ───────────────────────────────────────────────────────
[package]
name = "nabd"
version = "0.1.0"
edition = "2021"
description = "Nabḍ — desk workout tracker"
authors = ["Mohammad Ewais <mohammad.a.ewais@gmail.com>"]
license = "MIT"
default-run = "nabd"

[lib]
name = "nabd_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "nabd"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
chrono = { workspace = true }
serde = { workspace = true }
rusqlite = { workspace = true }
thiserror = { workspace = true }
nabd-persistence = { path = "crates/B11-persistence" }
nabd-native = { path = "crates/B12-native" }
nabd-ipc = { path = "crates/B13-ipc" }

# Linux idle time and tray-host detection speak D-Bus, X11 and Wayland directly.
# All four are pure Rust (zbus and gtk are already in the tree through Tauri),
# so no extra system library is linked: no libXss, no libwayland.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = "5"
gtk = "0.18"
x11rb = { version = "0.13", features = ["screensaver"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
windows-version = "0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[features]
# default tauri custom-protocol for production builds
custom-protocol = ["tauri/custom-protocol"]

# Small, self-contained release binary. `panic = "abort"` also means a panic on
# a background thread (the clock) ends the app instead of leaving it running
# without nudges.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
