<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nabḍ · نبض</title>
    <!-- Fonts bundled locally (no CDN) so they always render in the packaged app. -->
    <link rel="stylesheet" href="/fonts/fonts.css" />
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body {
        font-family: "Hanken Grotesk", system-ui, sans-serif;
        overflow: hidden;
      }
      /* Until React has rendered, show the dark theme's background instead of a
         blank frame. Not on html/body: Glass needs those to stay transparent. */
      #root:empty {
        background: oklch(0.21 0.014 265);
      }
      ::-webkit-scrollbar {
        width: 10px;
        height: 10px;
      }
      ::-webkit-scrollbar-thumb {
        background: var(--line);
        border-radius: 6px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
